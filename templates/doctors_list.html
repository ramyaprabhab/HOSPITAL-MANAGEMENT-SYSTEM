{% extends "base.html" %}
{% block content %}
<h2>Doctors in {{ spec }}</h2>
<div class="row">
    #ls of drs.
    {%for d in doctors %}
    <div class="col-md-4">
        <div class="card mb-3"><div class="card-body">
            <h5 class="card-title">{{ d.name }}</h5>
            <p><strong>Availability:</strong><br>{{ d.availability_notes or "9AM - 5PM" }}</p>
            <a href="{{ url_for('book')}}" class="btn btn-primary">Book Now</a>
        </div></div>
    </div>
    {% endfor %}
</div>
{% endblock %}
